{% extends 'core/base.html' %}
{% block title %}Lista de Livros{% endblock %}
{% block content %}

<h2>Livros cadastrados</h2>

<p><a href="{% url 'criar_livro' %}">Cadastrar novo livro</a></p>

<ul>
    {% for livro in livros %}
    <li>
        <a href="{% url 'detalhe_livro' livro.id %}">{{ livro.titulo }}</a>
        | <a href="{% url 'editar_livro' livro.id %}">Editar</a> |
        <a href="{% url 'excluir_livro' livro.id %}">Excluir</a>
    </li>
    {% endfor %}
</ul>
{% endblock %}
